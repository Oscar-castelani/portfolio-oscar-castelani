<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada (404) | Oscar Castelani</title>
  <meta name="description" content="La página que buscás no existe o fue movida. Volvé al inicio del sitio de Oscar Castelani." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .page-404 {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1rem;
      gap: 1rem;
    }
    .page-404 .code-404 {
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 800;
      line-height: 1;
      color: var(--orange);
      letter-spacing: -0.03em;
    }
    .page-404 h1 {
      font-size: clamp(1.4rem, 4vw, 2rem);
      color: var(--text-primary);
      margin: 0;
    }
    .page-404 p {
      max-width: 34rem;
      color: var(--text-secondary);
      margin: 0 auto;
    }
    .page-404 .actions-404 {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <main class="page-404">
    <div class="code-404" aria-hidden="true">404</div>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté roto o que la página se haya movido. No te preocupes, te llevamos de vuelta.</p>
    <div class="actions-404">
      <a class="btn btn-primary" href="/">Ir al inicio</a>
      <a class="btn btn-ghost" href="/servicios.html">Ver servicios</a>
      <a class="btn btn-ghost" href="/blog/">Ir al blog</a>
    </div>
  </main>
</body>
</html>
